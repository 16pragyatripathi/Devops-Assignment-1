# kube-state-metrics turns the state of Kubernetes objects into metrics
# (kube_pod_status_ready, kube_deployment_status_replicas_available, ...).
# cAdvisor only knows about container CPU/memory, not about Deployments or readiness.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pragya-kube-state-metrics
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pragya-kube-state-metrics
rules:
  - apiGroups: [""]
    resources: [nodes, pods, services, endpoints, namespaces, persistentvolumeclaims, persistentvolumes, configmaps, secrets, replicationcontrollers, resourcequotas, limitranges]
    verbs: [list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [list, watch]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pragya-kube-state-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pragya-kube-state-metrics
subjects:
  - kind: ServiceAccount
    name: pragya-kube-state-metrics
    namespace: monitoring
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pragya-kube-state-metrics
  namespace: monitoring
  labels:
    app: pragya-kube-state-metrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pragya-kube-state-metrics
  template:
    metadata:
      labels:
        app: pragya-kube-state-metrics
    spec:
      serviceAccountName: pragya-kube-state-metrics
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.20.0
          ports:
            - name: http-metrics
              containerPort: 8080
            - name: telemetry
              containerPort: 8081
          readinessProbe:
            httpGet: {path: /readyz, port: 8081}
          livenessProbe:
            httpGet: {path: /livez, port: 8080}
            initialDelaySeconds: 5
          resources:
            requests: {cpu: 20m, memory: 48Mi}
            limits: {cpu: 200m, memory: 192Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: pragya-kube-state-metrics
  namespace: monitoring
spec:
  selector:
    app: pragya-kube-state-metrics
  ports:
    - name: http-metrics
      port: 8080
      targetPort: http-metrics
