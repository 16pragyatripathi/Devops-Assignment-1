# Session 20 - monitoring namespace and the permissions Prometheus needs
# Prometheus uses Kubernetes service discovery, so it must be allowed to
# list/watch nodes, pods, services and endpoints, and to read kubelet metrics
# through the API server proxy (nodes/proxy, nodes/metrics).
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    owner: pragya
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pragya-prometheus
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pragya-prometheus
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/proxy, nodes/metrics, services, endpoints, pods]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - nonResourceURLs: [/metrics]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pragya-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pragya-prometheus
subjects:
  - kind: ServiceAccount
    name: pragya-prometheus
    namespace: monitoring
