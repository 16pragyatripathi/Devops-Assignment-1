# kubectl apply -k manifests/   installs the whole monitoring stack
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - 00-namespace-rbac.yaml
  - 01-prometheus-config.yaml
  - 02-prometheus.yaml
  - 03-kube-state-metrics.yaml
  - 04-alertmanager.yaml
  - 05-grafana.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: pragya-grafana-dashboard-s20
    namespace: monitoring
    files:
      - grafana/pragya-s20-overview.json
