# Class version used registry.k8s.io/e2e-test-images/dnsutils:1.3.
# "docker pull" of that tag returned "not found" for both arm64 and amd64,
# so I use busybox, which also ships nslookup and wget.
apiVersion: v1
kind: Pod

metadata:
  name: dns-test

spec:
  containers:
    - name: dns-test
      image: busybox:1.36
      command:
        - sleep
        - "3600"
