apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}-postgres
  labels:
    app: {{ .Values.name }}-postgres
    {{- include "lib.labels" . | nindent 4 }}
spec:
  selector:
    app: {{ .Values.name }}-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.name }}-postgres
  labels:
    app: {{ .Values.name }}-postgres
    {{- include "lib.labels" . | nindent 4 }}
spec:
  serviceName: {{ .Values.name }}-postgres
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.name }}-postgres
  template:
    metadata:
      labels:
        app: {{ .Values.name }}-postgres
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70          # "postgres" user in the alpine image
        fsGroup: 70
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database }}
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: {{ .Values.postgres.existingSecret }}, key: username}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.postgres.existingSecret }}, key: password}}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec: {command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]}
            periodSeconds: 10
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run              # unix socket + lock file
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - {name: run, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
