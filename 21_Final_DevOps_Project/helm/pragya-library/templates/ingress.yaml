{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.name }}
  labels:
    {{- include "lib.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.name }}-backend
                port: {number: 8000}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.name }}-frontend
                port: {number: 80}
{{- end }}
