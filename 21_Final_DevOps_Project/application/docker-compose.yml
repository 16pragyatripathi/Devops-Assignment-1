# Local three-tier stack: docker compose up --build
#   frontend  http://localhost:3320
#   backend   http://localhost:3321/docs
services:
  pragya-library-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: library
      POSTGRES_USER: library
      POSTGRES_PASSWORD: ${DB_PASSWORD:-library-local-only}
    volumes:
      - pragya-library-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library -d library"]
      interval: 3s
      retries: 20

  pragya-library-backend:
    build: ./backend
    image: pragya-library-backend:1.0.0
    environment:
      DATABASE_URL: postgresql+psycopg://library:${DB_PASSWORD:-library-local-only}@pragya-library-postgres:5432/library
      APP_VERSION: "1.0.0"
    depends_on:
      pragya-library-postgres:
        condition: service_healthy
    ports:
      - "3321:8000"

  pragya-library-frontend:
    build: ./frontend
    image: pragya-library-frontend:1.0.0
    depends_on:
      - pragya-library-backend
    ports:
      - "3320:8080"

volumes:
  pragya-library-pgdata:
