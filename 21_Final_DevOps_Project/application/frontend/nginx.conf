# Runs as the non-root "nginx" user, so it listens on 8080 (ports < 1024 need root)
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri /index.html;
  }

  # The browser only talks to this nginx; /api is proxied to the backend Service.
  # "pragya-library-backend" is the Docker Compose service name AND the Kubernetes Service name.
  location /api/ {
    proxy_pass http://pragya-library-backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }
}
