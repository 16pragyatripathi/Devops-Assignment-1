# Same slow app WITHOUT a startupProbe, and with a strict liveness probe.
# Liveness starts checking before nginx is listening, so the kubelet kills
# the container before it ever finishes starting.
apiVersion: v1
kind: Pod
metadata:
  name: no-startup-demo
spec:
  containers:
    - name: nginx
      image: nginx:1.27
      command: ["sh", "-c", "echo 'warming up for 20s...'; sleep 20; exec nginx -g 'daemon off;'"]
      ports:
        - containerPort: 80
      livenessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 2
        periodSeconds: 3
        failureThreshold: 3
