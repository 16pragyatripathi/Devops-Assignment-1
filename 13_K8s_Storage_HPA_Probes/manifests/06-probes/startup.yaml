# A "slow" app: the container waits 20s before nginx starts listening.
# The startupProbe gives it up to 30 x 2s = 60s to come up. Liveness and
# readiness only begin after the startup probe has succeeded once.
apiVersion: v1
kind: Pod
metadata:
  name: startup-demo
spec:
  containers:
    - name: nginx
      image: nginx:1.27
      command: ["sh", "-c", "echo 'warming up for 20s...'; sleep 20; exec nginx -g 'daemon off;'"]
      ports:
        - containerPort: 80
      startupProbe:
        httpGet:
          path: /
          port: 80
        failureThreshold: 30
        periodSeconds: 2
      livenessProbe:
        httpGet:
          path: /
          port: 80
        periodSeconds: 5
      readinessProbe:
        httpGet:
          path: /
          port: 80
        periodSeconds: 5
