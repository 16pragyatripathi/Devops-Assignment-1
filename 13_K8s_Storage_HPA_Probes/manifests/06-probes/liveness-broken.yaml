# Same as liveness.yaml but the probe asks for a page that does not exist.
# nginx answers 404, the kubelet counts it as a failure and restarts the container.
apiVersion: v1
kind: Pod
metadata:
  name: liveness-broken
spec:
  containers:
    - name: nginx
      image: nginx:1.27
      ports:
        - containerPort: 80
      livenessProbe:
        httpGet:
          path: /wrong-path
          port: 80
        initialDelaySeconds: 5
        periodSeconds: 5
        timeoutSeconds: 2
        failureThreshold: 3
