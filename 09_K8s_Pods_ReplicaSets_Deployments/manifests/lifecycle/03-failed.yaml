# Phase: Failed - a container exited non-zero and will not be restarted.
apiVersion: v1
kind: Pod
metadata:
  name: lifecycle-failed
  namespace: s10-lifecycle
spec:
  restartPolicy: Never
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo 'about to fail'; exit 1"]
