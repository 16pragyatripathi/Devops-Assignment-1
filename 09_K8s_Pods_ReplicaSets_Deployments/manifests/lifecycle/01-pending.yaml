# Phase: Pending - accepted by the API server but not running yet.
# This one asks for 100 CPUs, which no node in a 2-node kind cluster has, so
# the scheduler can never place it and it stays Pending with Unschedulable.
apiVersion: v1
kind: Pod
metadata:
  name: lifecycle-pending
  namespace: s10-lifecycle
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      resources:
        requests:
          cpu: "100"
