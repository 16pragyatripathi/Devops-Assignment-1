# Strategy 1: RollingUpdate - replace Pods gradually, never drop to zero.
# maxUnavailable: 0 means the old Pods only go away once new ones are Ready.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-rolling
  namespace: s10-strategies
spec:
  replicas: 4
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: web-rolling
  template:
    metadata:
      labels:
        app: web-rolling
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html
      volumes:
        - name: content
          configMap:
            name: content-v1
