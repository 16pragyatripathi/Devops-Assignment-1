# Strategy 4: Canary - most Pods stay on the old version, a few run the new one.
# Both Deployments share the label the Service selects on, so the traffic split
# is just the replica ratio: 4 stable + 1 canary = about 20% to the canary.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-stable
  namespace: s10-strategies
spec:
  replicas: 4
  selector:
    matchLabels:
      app: web-canary
      track: stable
  template:
    metadata:
      labels:
        app: web-canary
        track: stable
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html
      volumes:
        - name: content
          configMap:
            name: content-v1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-canary
  namespace: s10-strategies
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-canary
      track: canary
  template:
    metadata:
      labels:
        app: web-canary
        track: canary
    spec:
      containers:
        - name: web
          image: nginx:1.28-alpine
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html
      volumes:
        - name: content
          configMap:
            name: content-v2
---
# Selects only app=web-canary, NOT track, so it covers both Deployments.
apiVersion: v1
kind: Service
metadata:
  name: web-canary
  namespace: s10-strategies
spec:
  selector:
    app: web-canary
  ports:
    - port: 80
      targetPort: 80
