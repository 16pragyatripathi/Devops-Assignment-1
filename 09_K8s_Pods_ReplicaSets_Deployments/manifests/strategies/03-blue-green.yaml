# Strategy 3: Blue-Green - two full environments side by side. The Service
# selector decides which one receives traffic; the cutover is one label edit
# and is instant. Costs double the resources while both are up.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-blue
  namespace: s10-strategies
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-bg
      version: blue
  template:
    metadata:
      labels:
        app: web-bg
        version: blue
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html
      volumes:
        - name: content
          configMap:
            name: content-v1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-green
  namespace: s10-strategies
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-bg
      version: green
  template:
    metadata:
      labels:
        app: web-bg
        version: green
    spec:
      containers:
        - name: web
          image: nginx:1.28-alpine
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html
      volumes:
        - name: content
          configMap:
            name: content-v2
---
# Starts pointing at blue. The cutover is:
#   kubectl patch svc web-bg -n s10-strategies \
#     -p '{"spec":{"selector":{"app":"web-bg","version":"green"}}}'
apiVersion: v1
kind: Service
metadata:
  name: web-bg
  namespace: s10-strategies
spec:
  selector:
    app: web-bg
    version: blue
  ports:
    - port: 80
      targetPort: 80
